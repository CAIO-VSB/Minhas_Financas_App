services: 
  # SERVIÇO 1: Banco de Dados PostgreSQL
  postgres_db:
    image: postgres:18-alpine
    container_name: nuxt4_postgres
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amstopams
      POSTGRES_DB: nuxt-app
      PGDATA: /var/lib/postgresql/data/pgdata 
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql 
    networks:
      - nuxt_network

  # SERVIÇO 2: Aplicação Nuxt 4 em Ambiente de Desenvolvimento
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: nuxt4_app_dev
    ports: 
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:amstopams@postgres_db:5432/nuxt-app 
      NODE_ENV: development
    command: npx nuxt dev --host 0.0.0.0 --port 3000
    volumes: 
      - .:/app
      - /app/node_modules 
    depends_on:
      - postgres_db
    networks:
      - nuxt_network

volumes:
  postgres_data:

networks: 
  nuxt_network:
    driver: bridge
